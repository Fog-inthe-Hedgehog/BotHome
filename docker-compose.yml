services:
  bothome:
    image: bot-home:${TAG}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bothome
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    command: ["python", "-m", "app.main"]
    working_dir: /app
    networks:
      - bothome_net

networks:
  bothome_net:
    driver: bridge
