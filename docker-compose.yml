version: "3.9"

services:
  bothome:
    image: bot-home:${TAG}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bothome
    env_file:
      - .env
    restart: unless-stopped
    command: ["python", "app/main.py"]
    working_dir: /app
    networks:
      - bothome_net

networks:
  bothome_net:
    driver: bridge
